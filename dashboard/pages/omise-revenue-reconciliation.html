const LS_KEY = 'omise_rev_recon';
var currentFilter = {svc:'all', ms:'all', chk:'all'};

function loadUD(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'{}'); }catch(e){ return {}; } }
function saveUD(d){ localStorage.setItem(LS_KEY, JSON.stringify(d)); }
function getNote(id){ var d=loadUD(); return d[id]&&d[id].note||''; }
function getChk(id){ var d=loadUD(); return !!(d[id]&&d[id].chk); }

function fmt(n){ if(n==null)return'—'; return n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function setFilter(type, val, el){
  currentFilter[type]=val;
  // Update button active states in the same group
  if(el){
    var group = el.parentElement.querySelectorAll('.filter-btn');
    // find buttons in same logical group
    var btns;
    if(type==='svc') btns = document.querySelectorAll('[onclick*="setFilter(\'svc\'"]');
    else if(type==='ms') btns = document.querySelectorAll('[onclick*="setFilter(\'ms\'"]');
    else btns = document.querySelectorAll('[onclick*="setFilter(\'chk\'"]');
    btns.forEach(function(b){ b.classList.remove('active'); });
    el.classList.add('active');
  }
  renderTable();
}

  var q=document.getElementById('searchBox').value.trim().toLowerCase();
  return RAW_DATA.filter(function(r){
    if(currentFilter.svc!=='all' && r.svc!==currentFilter.svc) return false;
    if(currentFilter.ms==='ok' && r.ms!=='ok') return false;
    if(currentFilter.ms==='fail' && r.ms!=='fail') return false;
    if(currentFilter.ms==='noomi' && r.ms!=='noomi') return false;
    if(currentFilter.chk==='checked' && !getChk(r.oid)) return false;
    if(currentFilter.chk==='unchecked' && getChk(r.oid)) return false;
    if(q){
      var haystack=(r.oid+'|'+r.fn+'|'+r.ln+'|'+r.cid+'|'+r.ocard).toLowerCase();
      if(haystack.indexOf(q)<0) return false;
    }
    return true;
  });
}

function onNoteChange(id, val){
  var d=loadUD(); if(!d[id])d[id]={}; d[id].note=val; saveUD(d);
}
function onCheckChange(id, checked){
  var d=loadUD(); if(!d[id])d[id]={}; d[id].chk=checked; saveUD(d);
  var row=document.getElementById('row_'+id);
  if(row){ row.classList.toggle('row-checked', checked); }
}

function renderTable(){
  var data=getFiltered();
  var tbody=document.getElementById('tableBody');
  var html='';
  data.forEach(function(r,i){
    var chk=getChk(r.oid);
    var note=getNote(r.oid);
    var baseCls=r.ms==='ok'?'match-ok':r.ms==='fail'?'match-fail':'match-noomi';
    var rowCls=baseCls+(chk?' row-checked':'');
    var badge=r.ms==='ok'
      ?'<span class="badge-ok px-2 py-0.5 rounded text-xs font-bold">&#10003; ตรง</span>'
      :r.ms==='fail'
      ?'<span class="badge-fail px-2 py-0.5 rounded text-xs font-bold">&#9888; ไม่ตรง</span>'
      :'<span class="badge-noomi px-2 py-0.5 rounded text-xs font-bold">&#8212; ไม่มีใน Omise</span>';
    var diffStr=r.ms==='noomi'?'—':(r.diff===0?'<span class="text-green-400">0.00</span>':'<span class="text-red-400">'+fmt(r.diff)+'</span>');
    html+='<tr id="row_'+r.oid+'" class="border-t border-slate-800 '+rowCls+'">'
      +'<td class="px-2 py-1 text-slate-500">'+(i+1)+'</td>'
      +'<td class="px-2 py-1 font-mono font-semibold">'+r.oid+'</td>'
      +'<td class="px-2 py-1"><span class="px-1.5 py-0.5 rounded text-xs '+(r.svc==='Storage'?'bg-blue-900 text-blue-200':'bg-purple-900 text-purple-200')+'">'+r.svc+'</span></td>'
      +'<td class="px-2 py-1 whitespace-nowrap">'+r.dt+'</td>'
      +'<td class="px-2 py-1">'+(r.fn||'')+(r.ln?' '+r.ln:'')+'</td>'
      +'<td class="px-2 py-1 font-mono text-xs">'+(r.rno||'—')+'</td>'
      +'<td class="px-2 py-1 text-right">'+fmt(r.rev)+'</td>'
      +'<td class="px-2 py-1 text-right">'+(r.oamt!=null?fmt(r.oamt):'—')+'</td>'
      +'<td class="px-2 py-1 text-right">'+diffStr+'</td>'
      +'<td class="px-2 py-1 font-mono text-xs max-w-xs truncate" title="'+(r.cid||'')+'">'+(r.cid||'—')+'</td>'
      +'<td class="px-2 py-1">'+(r.ocard||'—')+'</td>'
      +'<td class="px-2 py-1">'+badge+'</td>'
      +'<td class="px-2 py-1"><textarea rows="1" oninput="onNoteChange(\''+r.oid+'\',this.value)" onblur="onNoteChange(\''+r.oid+'\',this.value)">'+note+'</textarea></td>'
      +'<td class="px-2 py-1 text-center"><input type="checkbox" '+(chk?'checked':'')+' onchange="onCheckChange(\''+r.oid+'\',this.checked)"></td>'
      +'</tr>';
  });
  tbody.innerHTML=html;
  document.getElementById('rowCount').textContent='แสดง '+data.length+' รายการ จากทั้งหมด '+RAW_DATA.length+' รายการ';
  updateSummary(data);
}

function updateSummary(data){
  var stor={rev:0,omi:0,ok:0,fail:0,noomi:0,cnt:0};
  var deli={rev:0,omi:0,ok:0,fail:0,noomi:0,cnt:0};
  RAW_DATA.forEach(function(r){
    var t=r.svc==='Storage'?stor:deli;
    t.rev+=r.rev||0; if(r.oamt!=null)t.omi+=r.oamt; t.cnt++;
    if(r.ms==='ok')t.ok++; else if(r.ms==='fail')t.fail++; else t.noomi++;
  });
  var grand={rev:stor.rev+deli.rev, omi:stor.omi+deli.omi};
  var cards=document.getElementById('summaryCards');
  function card(title, data, color){
    var diff=data.rev-data.omi;
    return '<div class="summary-card">'
      +'<div class="text-xs text-slate-400 font-semibold uppercase tracking-wide mb-2">'+title+'</div>'
      +'<div class="grid grid-cols-2 gap-1 text-xs">'
      +'<span class="text-slate-400">Revenue:</span><span class="text-right font-mono text-'+color+'-300">฿'+fmt(data.rev)+'</span>'
      +'<span class="text-slate-400">Omise:</span><span class="text-right font-mono text-'+color+'-300">฿'+fmt(data.omi)+'</span>'
      +'<span class="text-slate-400">ผลต่าง:</span><span class="text-right font-mono '+(diff===0?'text-green-400':'text-red-400')+'">฿'+fmt(diff)+'</span>'
      +'</div>'
      +'<div class="mt-2 flex gap-2 text-xs">'
      +'<span class="badge-ok px-1.5 rounded">'+data.ok+' ตรง</span>'
      +'<span class="badge-fail px-1.5 rounded">'+data.fail+' ไม่ตรง</span>'
      +'<span class="badge-noomi px-1.5 rounded">'+data.noomi+' ไม่มีใน Omise</span>'
      +'</div></div>';
  }
  var grandDiff=grand.rev-grand.omi;
  cards.innerHTML=card('Storage',stor,'blue')+card('Delivery',deli,'purple')
    +'<div class="summary-card col-span-2 lg:col-span-2">'
    +'<div class="text-xs text-slate-400 font-semibold uppercase tracking-wide mb-2">Grand Total</div>'
    +'<div class="grid grid-cols-2 gap-1 text-xs">'
    +'<span class="text-slate-400">Revenue รวม:</span><span class="text-right font-mono text-emerald-300 font-bold">฿'+fmt(grand.rev)+'</span>'
    +'<span class="text-slate-400">Omise รวม:</span><span class="text-right font-mono text-emerald-300 font-bold">฿'+fmt(grand.omi)+'</span>'
    +'<span class="text-slate-400">ผลต่างรวม:</span><span class="text-right font-mono font-bold '+(grandDiff===0?'text-green-400':'text-red-400')+'">฿'+fmt(grandDiff)+'</span>'
    +'</div></div>';
}

function exportExcel(){
  if(typeof XLSX==='undefined'){alert('ไม่สามารถ Export ได้\nกรุณาเชื่อมต่ออินเทอร์เน็ตก่อนเปิดหน้านี้ เนื่องจากต้องโหลด SheetJS library');return;}
  var today=new Date().toISOString().slice(0,10).replace(/-/g,'');
  var rows=RAW_DATA.map(function(r,i){
    return {
      '#':i+1,
      'Order ID':r.oid,
      'Service':r.svc,
      'วันที่':r.dt,
      'ชื่อ':((r.fn||'')+(r.ln?' '+r.ln:'')).trim(),
      'Receipt No':r.rno||'',
      'Revenue Amount':r.rev,
      'Omise Amount':r.oamt!=null?r.oamt:'',
      'Diff':r.diff,
      'Charge ID':r.cid||'',
      'Omise Card':r.ocard||'',
      'Match Status':r.ms,
      'Note':getNote(r.oid),
      'เช็คแล้ว':getChk(r.oid)?'เช็คแล้ว':''
    };
  });
  var ws=XLSX.utils.json_to_sheet(rows);
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,'Reconciliation',ws);
  var _wbout=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  var _blob=new Blob([_wbout],{type:'application/octet-stream'});
  var _url=URL.createObjectURL(_blob);
  var _a=document.createElement('a');
  _a.href=_url; _a.download='Omise_Revenue_Recon_202604_'+today+'.xlsx';
  document.body.appendChild(_a); _a.click();
  document.body.removeChild(_a); URL.revokeObjectURL(_url);
}

renderTable();
</script>
